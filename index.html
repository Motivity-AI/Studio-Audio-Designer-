<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="pageTitle">نظام التصميم الهندسي والصوتي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --accent: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Cairo', 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
            transition: direction 0.3s;
        }

        [dir="ltr"] body { font-family: 'Inter', 'Cairo', sans-serif; }

        .container { max-width: 1300px; margin: 0 auto; }

        /* شريط تبديل اللغة */
        .lang-bar {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-bottom: 15px;
        }

        .lang-btn {
            padding: 8px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-muted);
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s;
        }

        .lang-btn:hover { border-color: var(--primary); color: var(--text-main); }
        .lang-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 25px 20px;
            background: linear-gradient(135deg, #1e3a8a, #0f172a);
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        header h1 { font-size: 2.2rem; margin-bottom: 10px; color: #fff; }
        header p { font-size: 1.1rem; color: var(--text-muted); }

        .layout-grid {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 25px;
        }

        @media (max-width: 1000px) { .layout-grid { grid-template-columns: 1fr; } }

        .panel {
            background: var(--bg-card);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--primary); font-size: 0.95rem; }
        
        .input-group select, .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
            background: #0f172a;
            color: #fff;
            transition: all 0.3s;
        }

        .input-group select:focus, .input-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
        }

        .btn-group { display: flex; gap: 10px; margin-top: 15px; }

        button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-family: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-accent { background-color: var(--accent); color: white; }
        .btn-accent:hover { background-color: #059669; }

        #reportOutput { display: none; }
        #reportOutput.active { display: block; }

        .report-section { margin-bottom: 35px; page-break-inside: avoid; }
        
        .report-section h3 {
            font-size: 1.4rem;
            color: var(--primary);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-inline-start: 4px solid var(--primary);
            padding-inline-start: 10px;
        }

        .data-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }

        .data-card {
            background: #0f172a;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid var(--border);
        }

        .data-card .value { font-size: 1.4rem; font-weight: 700; color: var(--accent); }
        .data-card .label { font-size: 0.9rem; color: var(--text-muted); margin-top: 5px; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.9rem; }
        th, td { padding: 12px; text-align: start; border-bottom: 1px solid var(--border); }
        th { background-color: var(--primary); color: white; }
        tr:hover { background-color: rgba(255,255,255,0.05); }

        .gear-list { list-style: none; }
        .gear-list li {
            background: #0f172a;
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }
        .gear-list .gear-name { font-weight: 700; color: #fff; }
        .gear-list .gear-desc { font-size: 0.85rem; color: var(--text-muted); }
        .gear-list .gear-tag {
            background: var(--primary);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            white-space: nowrap;
        }
        .gear-list .gear-tag.essential { background: var(--danger); }

        .warning-box {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
            color: #fca5a5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 0.95rem;
        }

        .success-box {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--accent);
            color: #6ee7b7;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 0.95rem;
        }

        .graph-container {
            background: #111827;
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 20px;
            margin-top: 15px;
            text-align: center;
        }
        #modeGraph { width: 100%; height: 250px; }

        .checklist { list-style: none; }
        .checklist li {
            background: #0f172a;
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .checklist li:hover { border-color: var(--primary); }
        .checklist li.completed { opacity: 0.6; text-decoration: line-through; }
        .checklist input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: var(--accent);
            cursor: pointer;
            flex-shrink: 0;
        }

        @media print {
            body { background: #fff; color: #000; padding: 0; font-size: 12pt; }
            .container { max-width: 100%; }
            header, .panel:first-of-type, .btn-group, #printBtn, .lang-bar { display: none !important; }
            .layout-grid { display: block; }
            .panel { background: #fff; border: none; box-shadow: none; padding: 0; }
            #reportOutput { display: block !important; }
            .report-section h3 { color: #000; border-inline-start: 3px solid #000; page-break-after: avoid; }
            .data-card { background: #f8f9fa; border: 1px solid #ccc; color: #000; }
            .data-card .value { color: #000; }
            .data-card .label { color: #333; }
            th { background-color: #e5e7eb; color: #000; border: 1px solid #000; }
            td { border: 1px solid #000; }
            .gear-list li { background: #fff; border: 1px solid #ccc; }
            .gear-list .gear-name { color: #000; }
            .gear-tag { background: #000 !important; color: #fff !important; }
            .warning-box, .success-box { background: #fff; border: 2px solid #000; color: #000; }
            .graph-container { background: #fff; border: 1px solid #000; page-break-inside: avoid; }
            #modeGraph { filter: invert(1); }
            .checklist li { background: #fff; border: 1px solid #ccc; }
            .checklist li.completed { opacity: 1; text-decoration: none; }
            .page-break { page-break-before: always; }
            @page { margin: 2cm; }
        }
    </style>
</head>

<div class="container">
    <!-- شريط تبديل اللغة -->
    <div class="lang-bar">
        <button class="lang-btn active" data-lang="ar" onclick="setLanguage('ar')">🇸🇦 العربية</button>

        <button class="lang-btn" data-lang="fr" onclick="setLanguage('fr')">🇫🇷 Français</button>
    </div>

    <header>
        <h1 data-i18n="headerTitle">🏗️ المصمم الهندسي والصوتي المتكامل</h1>
        <p data-i18n="headerSubtitle">تحليل مودالي بصري + نسب غرفة + قائمة تحقق + تقرير PDF احترافي</p>
    </header>

    <div class="layout-grid">
        <!-- لوحة التحكم -->
        <div class="panel">
            <h2 style="color: var(--primary); margin-bottom: 20px;" data-i18n="settingsTitle">⚙️ إعدادات التصميم</h2>
            
            <div class="input-group">
                <label data-i18n="labelUseCase">الاستخدام الأساسي</label>
                <select id="useCase">
                    <option value="voiceover" data-i18n="useVoiceover">تعليق صوتي وبودكاست</option>
                    <option value="music" selected data-i18n="useMusic">إنتاج موسيقي وتسجيل</option>
                    <option value="mixing" data-i18n="useMixing">ميكساج وماسترينغ</option>
                    <option value="streaming" data-i18n="useStreaming">بث مباشر وصناعة محتوى</option>
                </select>
            </div>

            <div class="input-group">
                <label data-i18n="labelBudget">مستوى الميزانية</label>
                <select id="budget">
                    <option value="entry" data-i18n="budgetEntry">اقتصادية (مبتدئ)</option>
                    <option value="mid" selected data-i18n="budgetMid">متوسطة (احترافي)</option>
                    <option value="pro" data-i18n="budgetPro">عالية (استوديو تجاري)</option>
                </select>
            </div>

            <div class="input-group">
                <label data-i18n="labelDimensions">أبعاد الغرفة (م)</label>
                <div style="display: flex; gap: 10px;">
                    <input type="number" id="roomLength" value="4.0" step="0.1" data-i18n-placeholder="phLength" placeholder="الطول">
                    <input type="number" id="roomWidth" value="4.0" step="0.1" data-i18n-placeholder="phWidth" placeholder="العرض">
                    <input type="number" id="roomHeight" value="3.0" step="0.1" data-i18n-placeholder="phHeight" placeholder="الارتفاع">
                </div>
            </div>

            <div class="input-group">
                <label data-i18n="labelMicCount">عدد الميكروفونات (المدخلات)</label>
                <select id="micCount">
                    <option value="1" data-i18n="mic1">1 ميكروفون (فردي)</option>
                    <option value="2" data-i18n="mic2">2 ميكروفون (ثنائي)</option>
                    <option value="4" selected data-i18n="mic4">4 ميكروفونات (فرقة/بودكاست)</option>
                </select>
            </div>

            <div class="btn-group">
                <button class="btn-primary" onclick="generateStudio()">
                    <span>📐</span> <span data-i18n="btnAnalyze">تحليل وتصميم</span>
                </button>
                <button class="btn-accent" id="printBtn" onclick="window.print()" style="display: none;">
                    <span>📄</span> <span data-i18n="btnPrint">حفظ PDF</span>
                </button>
            </div>
        </div>

        <!-- لوحة النتائج -->
        <div class="panel" id="outputPanel">
            <div style="text-align: center; padding: 50px; color: var(--text-muted);">
                <h2 data-i18n="emptyState">👈 اضغط على "تحليل وتصميم" لبدء التصميم</h2>
                <p data-i18n="emptyStateSub">سيتم رسم المخطط، تحليل الأنماط، وتوليد التقرير المفصل.</p>
            </div>
        </div>
    </div>
</div>

    function drawStudioLayout(L, W, H, micCount) {
        const canvasW = 800, canvasH = 500, padding = 60;
        const maxDim = Math.max(L, W);
        const scale = Math.min((canvasW - padding * 2) / maxDim, (canvasH - padding * 2) / maxDim);
        const roomW = W * scale, roomH = L * scale;
        const offsetX = (canvasW - roomW) / 2, offsetY = (canvasH - roomH) / 2;

        const isRtl = currentLang === 'ar';
        const labels = {
            controlDesk: isRtl ? 'طاولة التحكم' : currentLang === 'fr' ? 'Console' : 'Control Desk',
            window: isRtl ? 'نافذة عازلة' : currentLang === 'fr' ? 'Fenêtre Isolante' : 'Isolation Window',
            recording: isRtl ? `منطقة التسجيل (${micCount} ميكروفون)` : currentLang === 'fr' ? `Zone d'Enregistrement (${micCount})` : `Recording Area (${micCount} mics)`,
            meters: isRtl ? 'م' : 'm'
        };

        let svg = `<svg id="studioCanvas" viewBox="0 0 ${canvasW} ${canvasH}" xmlns="http://www.w3.org/2000/svg">`;
        svg += `<rect x="${offsetX}" y="${offsetY}" width="${roomW}" height="${roomH}" fill="#1e293b" stroke="#3b82f6" stroke-width="4"/>`;
        
        const ft = 12;
        svg += `<rect x="${offsetX}" y="${offsetY}" width="${ft}" height="${roomH}" fill="#334155"/>`;
        svg += `<rect x="${offsetX + roomW - ft}" y="${offsetY}" width="${ft}" height="${roomH}" fill="#334155"/>`;
        svg += `<rect x="${offsetX}" y="${offsetY}" width="${roomW}" height="${ft}" fill="#334155"/>`;
        
        const windowY = offsetY + roomH * 0.45;
        const windowW = roomW * 0.6;
        const windowX = offsetX + (roomW - windowW) / 2;
        svg += `<rect x="${windowX}" y="${windowY}" width="${windowW}" height="6" fill="#0ea5e9" rx="3"/>`;
        svg += `<text x="${windowX + windowW/2}" y="${windowY - 8}" fill="#94a3b8" font-size="10" text-anchor="middle">${labels.window}</text>`;

        const deskW = roomW * 0.5, deskH = roomH * 0.15;
        const deskX = offsetX + (roomW - deskW) / 2, deskY = offsetY + roomH * 0.15;
        svg += `<rect x="${deskX}" y="${deskY}" width="${deskW}" height="${deskH}" fill="#4ade80" rx="4"/>`;
        svg += `<text x="${deskX + deskW/2}" y="${deskY + deskH/2 + 4}" fill="#000" font-size="12" font-weight="bold" text-anchor="middle">${labels.controlDesk}</text>`;
        
        const spkSize = 12;
        svg += `<circle cx="${deskX + 10}" cy="${deskY - 8}" r="${spkSize}" fill="#facc15"/>`;
        svg += `<circle cx="${deskX + deskW - 10}" cy="${deskY - 8}" r="${spkSize}" fill="#facc15"/>`;

        const micAreaY = offsetY + roomH * 0.65;
        const micSpacing = roomW / (micCount + 1);
        for (let i = 1; i <= micCount; i++) {
            const micX = offsetX + (micSpacing * i);
            svg += `<circle cx="${micX}" cy="${micAreaY}" r="10" fill="#ef4444" stroke="#fff" stroke-width="2"/>`;
            svg += `<text x="${micX}" y="${micAreaY + 4}" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">${i}</text>`;
            svg += `<circle cx="${micX}" cy="${micAreaY + 25}" r="6" fill="#64748b"/>`;
        }
        svg += `<text x="${offsetX + roomW/2}" y="${micAreaY + 50}" fill="#94a3b8" font-size="12" text-anchor="middle">${labels.recording}</text>`;

        svg += `<line x1="${offsetX}" y1="${offsetY - 15}" x2="${offsetX + roomW}" y2="${offsetY - 15}" stroke="#fff" stroke-width="1.5"/>`;
        svg += `<text x="${offsetX + roomW/2}" y="${offsetY - 25}" fill="#fff" font-size="12" text-anchor="middle">${W} ${labels.meters}</text>`;
        
        svg += `<line x1="${offsetX - 15}" y1="${offsetY}" x2="${offsetX - 15}" y2="${offsetY + roomH}" stroke="#fff" stroke-width="1.5"/>`;
        svg += `<text x="${offsetX - 25}" y="${offsetY + roomH/2}" fill="#fff" font-size="12" text-anchor="middle" transform="rotate(-90, ${offsetX - 25}, ${offsetY + roomH/2})">${L} ${labels.meters}</text>`;

        svg += `</svg>`;
        return svg;
    }

    function drawModeGraph(L, W, H) {
        const canvas = document.getElementById('modeGraph');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);
        
        const w = rect.width;
        const h = rect.height;
        const c = 343;

        let modes = [];
        for (let p = 1; p <= 5; p++) modes.push({ f: (c/2)*(p/L), type: 'Length' });
        for (let q = 1; q <= 5; q++) modes.push({ f: (c/2)*(q/W), type: 'Width' });
        for (let r = 1; r <= 5; r++) modes.push({ f: (c/2)*(r/H), type: 'Height' });
        modes = modes.filter(m => m.f <= 300).sort((a,b) => a.f - b.f);

        ctx.fillStyle = '#111827';
        ctx.fillRect(0, 0, w, h);

        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(40, h - 30);
        ctx.lineTo(w - 20, h - 30);
        ctx.stroke();

        ctx.fillStyle = '#64748b';
        ctx.font = '10px Cairo, Inter';
        ctx.textAlign = 'center';
        for (let f = 0; f <= 300; f += 50) {
            const x = 40 + (f / 300) * (w - 60);
            ctx.beginPath();
            ctx.moveTo(x, h - 30);
            ctx.lineTo(x, h - 25);
            ctx.stroke();
            ctx.fillText(f + 'Hz', x, h - 10);
        }

        modes.forEach(m => {
            const x = 40 + (m.f / 300) * (w - 60);
            const barHeight = 40 + Math.random() * 40;
            
            ctx.beginPath();
            ctx.moveTo(x, h - 30);
            ctx.lineTo(x, h - 30 - barHeight);
            ctx.strokeStyle = m.type === 'Length' ? '#ef4444' : m.type === 'Width' ? '#3b82f6' : '#10b981';
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(x, h - 30 - barHeight, 4, 0, Math.PI * 2);
            ctx.fillStyle = m.type === 'Length' ? '#ef4444' : m.type === 'Width' ? '#3b82f6' : '#10b981';
            ctx.fill();
        });

        // Legend (يعتمد على اتجاه الصفحة)
        const isRtl = currentLang === 'ar';
        ctx.textAlign = isRtl ? 'left' : 'right';
        const legendX = isRtl ? 20 : w - 20;
        ctx.fillStyle = '#ef4444'; ctx.fillText(t('graphLegendLength'), legendX, 20);
        ctx.fillStyle = '#3b82f6'; ctx.fillText(t('graphLegendWidth'), legendX, 35);
        ctx.fillStyle = '#10b981'; ctx.fillText(t('graphLegendHeight'), legendX, 50);
    }

    function calculateDetailedAcoustics(L, W, H, budgetLevel) {
        const V = L * W * H;
        const S_walls = 2 * (L * H) + 2 * (W * H);
        const S_floor = L * W;
        const S_ceiling = L * W;
        const S_total = S_walls + S_floor + S_ceiling;

        let matWall = absorptionCoeffs.foamPyramid;
        let matFloor = absorptionCoeffs.carpet;
        let matCeiling = absorptionCoeffs.foamPyramid;
        
        if (budgetLevel === 'entry') {
            matWall = [0.10, 0.20, 0.40, 0.60, 0.70, 0.70];
            matCeiling = [0.10, 0.20, 0.40, 0.60, 0.70, 0.70];
        }

        const rt60Bands = [];
        for (let i = 0; i < 6; i++) {
            const totalAbsorption = (S_walls * matWall[i]) + (S_floor * matFloor[i]) + (S_ceiling * matCeiling[i]) + (1.2 * absorptionCoeffs.glass[i]);
            const alphaAvg = totalAbsorption / S_total;
            const rt = alphaAvg > 0 ? (0.161 * V) / (S_total * alphaAvg) : 0;
            rt60Bands.push(rt);
        }

        const avgRt60 = rt60Bands.reduce((a, b) => a + b, 0) / 6;
        const schroeder = 2000 * Math.sqrt(V / S_total);
        
        const panelsNeeded = Math.ceil((S_walls * 0.4) / 0.25);
        const bassTrapsNeeded = 4;

        const ratios = [L/W, H/W].sort();
        const idealRatios = [1.14, 1.39];
        
        let ratioStatus, ratioMsg;
        if (Math.abs(ratios[0] - idealRatios[0]) > 0.15 || Math.abs(ratios[1] - idealRatios[1]) > 0.15) {
            ratioStatus = t('ratioStatusWarning');
            ratioMsg = t('warnRatioMsg');
        } else {
            ratioStatus = t('ratioStatusExcellent');
            ratioMsg = t('okRatioMsg');
        }

        return { V, S_total, avgRt60, rt60Bands, schroeder, panelsNeeded, bassTrapsNeeded, ratioStatus, ratioMsg };
    }

                    <li><div><div class="gear-name">${gear.mic[currentLang]}</div><div class="gear-desc">${t('gearMicDesc')}</div></div><div class="gear-tag essential">${t('tagEssential')}</div></li>
                    <li><div><div class="gear-name">${gear.interface[currentLang]}</div><div class="gear-desc">${t('gearInterfaceDesc')}</div></div><div class="gear-tag essential">${t('tagEssential')}</div></li>
                    <li><div><div class="gear-name">${gear.monitors[currentLang]}</div><div class="gear-desc">${t('gearMonitorsDesc')}</div></div><div class="gear-tag essential">${t('tagEssential')}</div></li>
                    <li><div><div class="gear-name">${t('materialFoam')} + ${t('materialBass')}</div><div class="gear-desc">${t('gearTreatmentDesc')}</div></div><div class="gear-tag essential">${t('tagRequired')}</div></li>
                    <li><div><div class="gear-name">${gear.extra[currentLang]}</div><div class="gear-desc">${t('gearExtraDesc')}</div></div><div class="gear-tag">${t('tagRecommended')}</div></li>
                </ul>
            </div>

            <div class="report-section">
                <h3>${t('secChecklist')}</h3>
                <ul class="checklist" id="setupChecklist">
                    <li onclick="toggleCheck(this)"><input type="checkbox"> <span>${t('checkBassTraps')}</span></li>
                    <li onclick="toggleCheck(this)"><input type="checkbox"> <span>${t('checkFoam')}</span></li>
                    <li onclick="toggleCheck(this)"><input type="checkbox"> <span>${t('checkCarpet')}</span></li>
                    <li onclick="toggleCheck(this)"><input type="checkbox"> <span>${t('checkXlr')}</span></li>
                    <li onclick="toggleCheck(this)"><input type="checkbox"> <span>${t('checkUsb')}</span></li>
                    <li onclick="toggleCheck(this)"><input type="checkbox"> <span>${t('checkMonitors')}</span></li>
                    <li onclick="toggleCheck(this)"><input type="checkbox"> <span>${t('checkGain')}</span></li>
                    <li onclick="toggleCheck(this)"><input type="checkbox"> <span>${t('checkTest')}</span></li>
                </ul>
            </div>
        `;

        const outputPanel = document.getElementById('outputPanel');
        outputPanel.innerHTML = reportHTML;
        outputPanel.classList.add('active');
        document.getElementById('printBtn').style.display = 'flex';

        setTimeout(() => drawModeGraph(L, W, H), 100);
    }

    function toggleCheck(li) {
        const checkbox = li.querySelector('input[type="checkbox"]');
        checkbox.checked = !checkbox.checked;
        li.classList.toggle('completed', checkbox.checked);
    }

    // تشغيل تلقائي
    window.onload = function() {
        setLanguage('ar');
        generateStudio();
    };
</script>

</body>
